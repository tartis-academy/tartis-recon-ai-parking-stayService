# Postgres dedicado de stay-service (database-per-service, perfil prod o
# servicio aislado). El Postgres compartido del dia a dia en dev vive en el
# repo de infra (./setup.sh). Ver Convenciones del proyecto Parking S4.
#
#   docker network create parking-shared   (una vez)

services:
  postgres:
    image: postgres:15.18-alpine
    container_name: parking-stay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${STAY_DB_USER}
      POSTGRES_PASSWORD: ${STAY_DB_PASSWORD}
      POSTGRES_DB: ${STAY_DB_NAME}
    ports:
      - "${STAY_DB_PORT:-5437}:5432"
    volumes:
      - parking-stay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAY_DB_USER} -d ${STAY_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - parking-shared
  # Broker de mensajeria (ASY-02/ASY-03). Broker UNICO compartido por
  # stay-service (publicador) y ticket-service/spot-service (consumidores),
  # a diferencia del Postgres de arriba que es dedicado por servicio.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: parking-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      # UI de administracion: http://localhost:15672
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - parking-shared

volumes:
  parking-stay-postgres-data:

networks:
  parking-shared:
    external: true
