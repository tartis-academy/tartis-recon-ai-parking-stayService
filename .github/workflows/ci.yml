name: CI

on:
  pull_request:
  push:
    branches: [main, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/stay-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # El pom compila a bytecode 17 (maven.compiler source/target) pero el
          # runner usa 21: SonarQube Cloud dejo de soportar analizar con JDK 17
          # desde julio 2026. Lombok 1.18.30 soporta 21 sin problema (el limite
          # documentado es JDK 25).
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # TODO: quitar -DskipTests (y anadir Postgres como service container)
      # cuando el dominio de stay-service este implementado. Hoy StayEntity
      # es una clase vacia sin @Entity/@Id.
      - name: Build
        run: ./mvnw -B verify -DskipTests
