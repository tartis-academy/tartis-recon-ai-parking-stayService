name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/stay-service

    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo necesita para calcular el
          # "new code" (blame por commit) al evaluar el quality gate.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          # El pom compila a bytecode 17 (maven.compiler source/target) pero el
          # runner usa 21: SonarQube Cloud dejo de soportar analizar con JDK 17
          # desde julio 2026. Lombok 1.18.30 soporta 21 sin problema (el limite
          # documentado es JDK 25).
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # TODO: quitar -DskipTests (y anadir Postgres como service container)
      # cuando el dominio de stay-service este implementado. Hoy StayEntity
      # es una clase vacia sin @Entity/@Id.
      # jacoco-maven-plugin (pom.xml) igual genera target/site/jacoco/jacoco.xml
      # en esta fase, aunque no haya tests corriendo: sin ejecuciones el reporte
      # sale vacio (0% cobertura), pero no rompe el build.
      - name: Build
        run: ./mvnw -B verify -DskipTests

      - name: Cache paquetes de SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Requiere el secret SONAR_TOKEN del repo.
      - name: Analisis SonarCloud (quality gate)
        # TEMPORAL: el analisis se publica igual, pero no tumba el job. Hoy la
        # consulta final del gate falla con "Not authorized or project not
        # found" porque el SONAR_TOKEN no tiene permiso para leer su estado.
        # Quitar esta linea cuando el token este arreglado y se quiera que el
        # gate bloquee de verdad.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B sonar:sonar
          -Dsonar.projectKey=1dd0rv_tartis-recon-ai-parking-stayService
          -Dsonar.organization=1dd0rv
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
