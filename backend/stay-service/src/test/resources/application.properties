spring.datasource.url=jdbc:postgresql://${STAY_DB_HOST:localhost}:${STAY_DB_PORT:5437}/${STAY_DB_NAME:stay_db}
spring.datasource.username=${STAY_DB_USER:stay_user}
spring.datasource.password=${STAY_DB_PASSWORD:change.me}

spring.jpa.hibernate.ddl-auto=create-drop

# Hibernate ya crea y destruye el esquema en cada run; Flyway no aporta nada
# aqui y solo anadiria una flyway_schema_history de mas.
spring.flyway.enabled=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/parking

# Registro del cliente client_credentials con el que stay pide su token de
# servicio. Estas properties tienen que estar tambien aqui porque este fichero
# tapa al application.properties de src/main en el classpath de test: sin
# ellas no se crea el ClientRegistrationRepository y el contexto no arranca.
# Valores de mentira a proposito, en los tests no se llama a Keycloak.
spring.security.oauth2.client.registration.parking-stay.provider=keycloak
spring.security.oauth2.client.registration.parking-stay.client-id=parking-stay-service
spring.security.oauth2.client.registration.parking-stay.client-secret=test-secret
spring.security.oauth2.client.registration.parking-stay.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=http://localhost:8180/realms/parking/protocol/openid-connect/token
