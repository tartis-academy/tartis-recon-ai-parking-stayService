spring.datasource.url=jdbc:postgresql://${STAY_DB_HOST:localhost}:${STAY_DB_PORT:5437}/${STAY_DB_NAME:stay_db}
spring.datasource.username=${STAY_DB_USER:stay_user}
spring.datasource.password=${STAY_DB_PASSWORD:change.me}

spring.jpa.hibernate.ddl-auto=create-drop

# Hibernate ya crea y destruye el esquema en cada run; Flyway no aporta nada
# aqui y solo anadiria una flyway_schema_history de mas.
spring.flyway.enabled=false
