# Perfil "test": arranque del contexto contra H2 en memoria, sin Postgres externo.
# Lo usa StayServiceApplicationTests (@ActiveProfiles("test")). Al activar este
# perfil explicitamente, NO se carga application-dev.properties, de modo que el
# smoke test no intenta conectar al Postgres de dev.

spring.datasource.url=jdbc:h2:mem:staytest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 usa el esquema por defecto (no se fija "stay") para que Hibernate cree la tabla.
spring.jpa.hibernate.ddl-auto=create-drop

# Desactiva el arranque de docker-compose durante los tests.
spring.docker.compose.enabled=false
