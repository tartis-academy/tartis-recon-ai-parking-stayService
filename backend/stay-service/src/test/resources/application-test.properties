# Base de datos H2 para tests
spring.datasource.url=jdbc:h2:mem:staydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# URLs de microservicios remotos para evitar que falle la inyección de @Value
services.spot.url=http://spot-service:8080
services.tariff.url=http://tariff-service:8080
services.ticket.url=http://ticket-service:8080
services.vehicle.url=http://vehicle-service:8080