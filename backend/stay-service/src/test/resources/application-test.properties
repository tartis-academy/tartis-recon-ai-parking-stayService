# Base de datos H2 para tests
spring.datasource.url=jdbc:h2:mem:staydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.docker.compose.enabled=false
# Hibernate ya crea y destruye el esquema en cada run; Flyway no aporta nada
# aqui y solo anadiria una flyway_schema_history de mas.
spring.flyway.enabled=false
# URLs de microservicios remotos para evitar que falle la inyección de @Value
services.spot.url=http://spot-service:8080
services.tariff.url=http://tariff-service:8080
services.ticket.url=http://ticket-service:8080
services.vehicle.url=http://vehicle-service:8080

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/parking
