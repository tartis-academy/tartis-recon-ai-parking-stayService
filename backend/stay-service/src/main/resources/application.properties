spring.application.name=stay-service

spring.config.import=optional:file:.env[.properties]

spring.profiles.default=dev

spring.jpa.open-in-view=false

spring.docker.compose.enabled=false

# RECON-812: las Postgres de demo/prod ya tenian tablas creadas por el
# schema.sql que se montaba como init script. baseline-on-migrate hace que,
# si Flyway encuentra un esquema no vacio sin su tabla de historial, marque
# V1 como ya aplicada en vez de fallar con "relation already exists".
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.url=/openapi.yml

# --- Servicios Externos (Puertos de Salida) ---
services.spot.url=http://spot-service:8080
services.tariff.url=http://tariff-service:8080
services.ticket.url=http://ticket-service:8080
services.vehicle.url=http://vehicle-service:8080

# Cliente client_credentials con el que stay pide su propio token para llamar
# a los otros microservicios (ver BeanConfiguration). El id de registro
# "parking-stay" es el que resuelve el interceptor; el client-id real y el
# secreto llegan por entorno, que es lo que inyecta docker-compose.demo.yml.
#
# El token-uri por defecto es el hostname interno de Docker: stay lo pide
# desde dentro de la red. El `iss` del token que sale sigue siendo el publico
# (KC_HOSTNAME en Keycloak), que es lo que validan los otros servicios.
spring.security.oauth2.client.registration.parking-stay.provider=keycloak
spring.security.oauth2.client.registration.parking-stay.client-id=${STAY_CLIENT_ID:parking-stay-service}
spring.security.oauth2.client.registration.parking-stay.client-secret=${STAY_CLIENT_SECRET:}
spring.security.oauth2.client.registration.parking-stay.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/parking/protocol/openid-connect/token}