spring.application.name=stay-service

spring.config.import=optional:file:.env[.properties]

spring.profiles.default=dev

spring.jpa.open-in-view=false

spring.docker.compose.enabled=false

# RECON-812: las Postgres de demo/prod ya tenian tablas creadas por el
# schema.sql que se montaba como init script. baseline-on-migrate hace que,
# si Flyway encuentra un esquema no vacio sin su tabla de historial, marque
# V1 como ya aplicada en vez de fallar con "relation already exists".
spring.flyway.baseline-on-migrate=true

# RES-02: circuitbreakers muestra el estado actual de cada instancia y
# circuitbreakerevents el historico de transiciones; sin exponerlos, la unica
# forma de saber si un circuito esta abierto es leer los logs.
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
management.endpoint.health.probes.enabled=true
# El estado del circuito (register-health-indicator: true en application.yml)
# solo aparece en /actuator/health si se muestran los detalles.
#
# when-authorized (escenarios de ruptura BD): con show-details=always, cualquiera
# sin autenticar podia ver, en /actuator/health que es permitAll, el campo "error"
# que DataSourceHealthIndicator puebla con el mensaje de la excepcion de la base
# de datos cuando esta falla. Eso es detalle interno al exterior por una via que
# se salta el advice.
#
# when-authorized NO basta por si solo: el rol de autorizacion del actuator
# (management.endpoint.health.roles) esta vacio por defecto, y vacio en Spring
# Boot significa "cualquier usuario autenticado", no "ADMIN". Un USER con token
# valido seguiria viendo el mensaje de error de la BD. roles=ADMIN lo restringe
# de verdad.
#
# Coste asumido: el estado de los circuit breakers (register-health-indicator:
# true en application.yml) deja de verse sin autenticar y sin rol ADMIN; las
# demos en vivo de transiciones CLOSED -> OPEN -> HALF_OPEN necesitan el token
# de admin (o /actuator/circuitbreakerevents con el mismo requisito). Las
# sondas de Kubernetes no se ven afectadas: liveness/readiness no requieren
# detalles.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.health.circuitbreakers.enabled=true
# GW-06: mete el correlation-id y la identidad del llamante en cada linea de
# log. Sin esto los filtros funcionan pero nada de lo que ponen en el MDC se ve
# por ningun sitio, que es todo el objetivo del ticket.
#
# Que lleva cada hueco:
#   correlationId  lo pone CorrelationIdFilter, con el valor que genera Kong.
#                  Es lo que permite unir los logs de Kong y los de los cinco
#                  microservicios en una sola peticion.
#   userName       preferred_username del token verificado (RequestIdentityFilter).
#   clientId       claim azp: distingue si la llamada viene de un usuario por el
#                  frontend o de otro microservicio con client_credentials.
#
# El "anon" cubre /actuator y el perfil dev, donde no hay autenticacion y no hay
# nada que poner. El :- deja el hueco en blanco si la clave no esta, para que
# las lineas de arranque no salgan con un "null" delante.
#
# El patron por defecto de consola de Spring Boot ya reserva un hueco para esto,
# asi que basta con rellenarlo y no hay que redefinir el patron entero (que
# costaria los colores y el formato de Boot).
#
# Esta linea es IDENTICA en los cinco microservicios y se cambia en los cinco a
# la vez: descuadrarla en uno solo deja sus logs sin poder compararse con el
# resto, que es justo lo que GW-06 viene a resolver.
logging.pattern.correlation=[${spring.application.name:stay-service}] [%X{correlationId:-}] [%X{userName:-anon}@%X{clientId:-}]

# GW-06: logger dedicado del log de acceso (RequestLoggingFilter). Separado del
# resto para poder silenciarlo (level=WARN) sin perder los logs de negocio, o
# mandarlo a otro appender el dia que haya agregacion centralizada.
logging.level.http.access=INFO

springdoc.swagger-ui.url=/openapi.yml

# --- Servicios Externos (Puertos de Salida) ---
services.spot.url=http://spot-service:8080
services.tariff.url=http://tariff-service:8080
services.ticket.url=http://ticket-service:8080
services.vehicle.url=http://vehicle-service:8080

# RES-06: timeouts explicitos de las llamadas RestClient entre servicios.
# Antes estaban hardcodeados (3s/5s) en BeanConfiguration; se externalizan para
# poder ajustarlos por entorno sin recompilar. connect = tiempo maximo para
# abrir la conexion; read = tiempo maximo esperando la respuesta.
services.rest-client.connect-timeout-ms=${REST_CONNECT_TIMEOUT_MS:3000}
services.rest-client.read-timeout-ms=${REST_READ_TIMEOUT_MS:5000}
# RES-06 (deuda Fase I): en la ruta sincrona de check-in, vehicle-service
# consulta a un proveedor EXTERNO de datos de vehiculo, mas lento que los
# servicios internos. Se le da un read timeout propio, mas holgado, para no
# cortar consultas legitimas que tardan mas que el resto de integraciones.
# El connect timeout se comparte (abrir la conexion no depende del proveedor).
services.rest-client.vehicle.read-timeout-ms=${VEHICLE_READ_TIMEOUT_MS:8000}

# Cliente client_credentials con el que stay pide su propio token para llamar
# a los otros microservicios (ver BeanConfiguration). El id de registro
# "parking-stay" es el que resuelve el interceptor; el client-id real y el
# secreto llegan por entorno, que es lo que inyecta docker-compose.demo.yml.
#
# El token-uri por defecto es el hostname interno de Docker: stay lo pide
# desde dentro de la red. El `iss` del token que sale sigue siendo el publico
# (KC_HOSTNAME en Keycloak), que es lo que validan los otros servicios.
spring.security.oauth2.client.registration.parking-stay.provider=keycloak
spring.security.oauth2.client.registration.parking-stay.client-id=${STAY_CLIENT_ID:parking-stay-service}
# Sin default a proposito: si falta STAY_CLIENT_SECRET la aplicacion no
# arranca. Con un default vacio arrancaba tan contenta y reventaba en la
# primera llamada saliente, que es el peor momento para enterarse.
# docker-compose.demo.yml es igual de estricto (${STAY_CLIENT_SECRET:?...}).
spring.security.oauth2.client.registration.parking-stay.client-secret=${STAY_CLIENT_SECRET}
spring.security.oauth2.client.registration.parking-stay.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/parking/protocol/openid-connect/token}

# Conexion a RabbitMQ. stay declara el exchange y las dos colas de
# stay-closed-v1, pero no tenia NINGUNA de estas properties, asi que caia en
# el default de Spring (localhost) y dentro del contenedor eso es
# "AmqpConnectException: Connection refused". Consecuencias que se vieron al
# levantar el stack completo:
#   - el actuator incluye el indicador de salud de RabbitMQ, asi que el
#     contenedor se quedaba en unhealthy pese a que la aplicacion arrancaba
#     bien ("Started StayServiceApplication").
#   - spot-service-stay-closed-queue no llegaba a crearse nunca, porque la
#     declara stay y stay no conectaba.
# Mismo patron que ticket-service, que si las tenia y por eso funcionaba.
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Si está en true utiliza RabbitMQ; si se cambia a false commuta a llamadas REST síncronas
parking.async.enabled=true

# SSE-06: stay-service pasa a consumir tariff-changed-v1 y spot-status-changed-v1
# ademas de publicar. Sin default-requeue-rejected=false el mensaje fallido se
# requeue infinitamente y nunca llega a la DLQ (mismo patron ya usado en
# spot-service/ticket-service para stay-closed-v1, ASY-08).
#
# OJO: estas propiedades spring.rabbitmq.listener.simple.* son GLOBALES, es
# decir, se aplican a cualquier @RabbitListener del servicio, presente o
# futuro. La concurrencia NO se fija aqui a proposito: los listeners de
# SSE-06 la necesitan en 1 para no invertir el orden de eventos de una misma
# plaza/tarifa (ver sseListenerContainerFactory en RabbitMQConfig), asi que
# usan un container factory dedicado en vez del default. Si se anade un
# listener nuevo que si tolere paralelismo, no heredara concurrency=1: tendra
# que declarar su propio factory o usar el default (sin limite explicito).
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=6
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms

# SSE-02: timeout de cada conexion SseEmitter (GET /v1/events) y periodo del
# heartbeat que evita que un proxy intermedio (Kong) la cierre por
# inactividad. Ambos configurables por entorno.
sse.emitter.timeout-ms=${SSE_EMITTER_TIMEOUT_MS:1800000}
sse.heartbeat.interval-ms=${SSE_HEARTBEAT_INTERVAL_MS:15000}
# El heartbeat escribe en el socket de cada cliente: con el pool por defecto (1)
# un cliente lento bloquea el heartbeat de todos los demas en ese tick.
spring.task.scheduling.pool.size=2