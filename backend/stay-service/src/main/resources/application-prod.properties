# BD dedicada del microservicio (database-per-service).
spring.datasource.url=jdbc:postgresql://${STAY_DB_HOST}:${STAY_DB_PORT:5432}/${STAY_DB_NAME:stay_db}
spring.datasource.username=${STAY_DB_USER}
spring.datasource.password=${STAY_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.devtools.restart.enabled=false
